name: Deploy private LMS videos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-private-lms-media
  cancel-in-progress: false

jobs:
  deploy:
    name: Secure and deploy private course videos
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6

      - name: Create a web access deny rule for the protected media folder
        shell: bash
        run: |
          mkdir -p assets/lms/public-guard
          cat > assets/lms/public-guard/.htaccess <<'EOF'
          Options -Indexes
          Require all denied
          Deny from all
          EOF

      - name: Deploy the web access deny rule
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.HOSTINGER_FTP_PORT || 21 }}
          local-dir: assets/lms/public-guard/
          server-dir: ../sr-academy-private-media/
          state-name: .ftp-deploy-public-lms-media-guard-state.json
          dangerous-clean-slate: false

      - name: Download and verify Speakathon videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/lms/videos
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/jayantc1011/sr/releases/tags/lms-media-2026-10-14 \
            --output /tmp/speakathon-release.json
          release_tag="$(jq -r '.tag_name' /tmp/speakathon-release.json)"
          echo "Release metadata received for $release_tag"
          jq -r '.assets[] | select(.name | endswith(".mp4")) | [.name, (.size|tostring), (.id|tostring), .digest] | @tsv' \
            /tmp/speakathon-release.json > /tmp/speakathon-videos.tsv
          video_count="$(wc -l < /tmp/speakathon-videos.tsv | tr -d ' ')"
          echo "Found $video_count MP4 assets"
          test "$video_count" -ge 21 || { echo "Expected at least 21 daily lesson videos"; exit 1; }
          while IFS="$(printf '\t')" read -r name expected_size asset_id digest; do
            echo "Downloading $name ($expected_size bytes)"
            curl --fail --show-error --location --retry 3 --retry-delay 2 --continue-at - \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/jayantc1011/sr/releases/assets/$asset_id" \
              --output "assets/lms/videos/$name"
            actual_size="$(wc -c < "assets/lms/videos/$name" | tr -d ' ')"
            test "$actual_size" = "$expected_size" || { echo "Size mismatch for $name"; exit 1; }
            expected_sha="${digest#sha256:}"
            echo "$expected_sha  assets/lms/videos/$name" | sha256sum --check || { echo "Checksum mismatch for $name"; exit 1; }
          done < /tmp/speakathon-videos.tsv

      - name: Download and verify Power Dressing Module 1 Lesson 2 cuts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/JayantAI-Dev/shalini-lms/releases/tags/power-dressing-module-1-lesson-2-media \
            --output /tmp/power-dressing-release.json
          jq -r '.assets[] | select(.name | test("^module-01-lesson-02-v[123]\\.mp4$")) | [.name, (.size|tostring), (.id|tostring), .digest] | @tsv' \
            /tmp/power-dressing-release.json > /tmp/power-dressing-videos.tsv
          video_count="$(wc -l < /tmp/power-dressing-videos.tsv | tr -d ' ')"
          echo "Found $video_count Power Dressing Module 1 Lesson 2 cuts"
          test "$video_count" = 3 || { echo "Expected the three Lesson 2 video cuts"; exit 1; }
          while IFS="$(printf '\t')" read -r name expected_size asset_id digest; do
            echo "Downloading $name ($expected_size bytes)"
            curl --fail --show-error --location --retry 3 --retry-delay 2 --continue-at - \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/JayantAI-Dev/shalini-lms/releases/assets/$asset_id" \
              --output "assets/lms/videos/$name"
            actual_size="$(wc -c < "assets/lms/videos/$name" | tr -d ' ')"
            test "$actual_size" = "$expected_size" || { echo "Size mismatch for $name"; exit 1; }
            expected_sha="${digest#sha256:}"
            echo "$expected_sha  assets/lms/videos/$name" | sha256sum --check || { echo "Checksum mismatch for $name"; exit 1; }
          done < /tmp/power-dressing-videos.tsv
          du -sh assets/lms/videos

      - name: Deploy videos to the protected WordPress media folder
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.HOSTINGER_FTP_PORT || 21 }}
          local-dir: assets/lms/videos/
          server-dir: ../../sr-academy-private-media/assets/lms/videos/
          state-name: .ftp-deploy-private-lms-media-state.json
          dangerous-clean-slate: false
